# Pi Dashboard module/display map.
#
# Copy this file to modules.yaml (gitignored) and edit as needed — modules.yaml
# is the real, machine-specific config; this file is the tracked template.
#
# Lines shared by every physical display (wired identically, one bus):
display_bus:
  spi_bus: 0            # /dev/spidev0.<device> — device index below is ignored,
  spi_device: 0          # we never use hardware CS; every display's CS is a plain
                          # software-toggled GPIO listed per-module below.
  dc_pin: 24              # BCM GPIO, shared Data/Command line
  rst_pin: 25              # BCM GPIO, shared Reset line
  width: 240
  height: 240
  spi_speed_hz: 1000000  # Start conservative on breadboard jumpers — 8MHz was
                          # already unreliable with just 2 panels sharing the
                          # bus (one panel initializes but stays blank/white).
                          # See docs/WIRING.md "Bring-up" before raising this.

# One entry per module. `cs_pin` must be unique across all entries (including
# reserved/disabled ones you plan to wire later) — see docs/WIRING.md for the
# full pin table and rationale for the choices below.
modules:
  weather:
    enabled: true
    cs_pin: 5
    rotate_180: true        # panel is mounted 180 from claude_usage's orientation
    refresh_interval_sec: 900        # 15 min
    params:
      # Default: zip 63043 (Maryland Heights, MO). Override lat/lon for a
      # different location — Open-Meteo needs no API key.
      latitude: 38.7229
      longitude: -90.4474

  claude_usage:
    enabled: true
    cs_pin: 6
    refresh_interval_sec: 600        # 10 min

  bambu_printer:
    enabled: false        # flip on once wired + params below are filled in
    cs_pin: 13             # was reserved_1 — see docs/WIRING.md
    rotate_180: true        # panel is mounted 180 from claude_usage's orientation
    refresh_interval_sec: 30        # print progress moves faster than weather/usage
    params:
      mode: lan        # "lan" (default) or "cloud" — see orbiboard/modules/bambu_printer.py
      serial: ""        # printer serial either way (Settings > Device)

      # --- mode: lan --- LAN-only mode must be enabled on the printer.
      # ip/access_code from the printer's screen (Settings > Network).
      ip: ""
      access_code: ""

      # --- mode: cloud --- no ip/access_code needed. Run
      # scripts/bambu_cloud_auth_setup.py once first to log into your Bambu
      # account and cache a token in state/bambu_cloud_creds.json.
      # region: us        # "us" or "cn", picks the cloud MQTT broker

  stocks:
    enabled: false        # flip on once wired + config/stocks.yaml is filled in
    cs_pin: 16             # was reserved_2 — see docs/WIRING.md
    rotate_180: true        # panel is mounted 180 from claude_usage's orientation
    refresh_interval_sec: 3        # drives on-screen cycling, not network calls
    # params: {} — holdings live in config/stocks.yaml, not here (see
    # config/stocks.example.yaml to set up your positions).

  clock:
    enabled: false        # flip on once wired
    cs_pin: 19             # was reserved_3 — see docs/WIRING.md
    rotate_180: true        # panel is mounted 180 from claude_usage's orientation
    refresh_interval_sec: 20
    params:
      format_24h: false        # true for 24-hour time instead of AM/PM

  # --- Reserved slots -------------------------------------------------
  # Spare CS pins wired at build time (per PRD "provision for 4-6 displays
  # now") so future modules (calendar, system stats, crypto, RSS, ...) are
  # pure software additions: write orbiboard/modules/<id>.py, uncomment/add
  # an entry here, `systemctl enable --now orbiboard-module@<id>`. No rewiring.
  # reserved_4:
  #   enabled: false
  #   cs_pin: 26
  #   rotate_180: true        # panel is mounted 180 from claude_usage's orientation
